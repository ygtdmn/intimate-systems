<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
            }
            #loading {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                font-family: monospace;
                color: #999;
                font-size: 0.9rem;
            }
            .error {
                color: #c33;
                text-align: center;
                padding: 2em;
            }
        </style>
    </head>
    <body>
        <div id="loading">gathering intimate systems…</div>
        <script src="/rpc.js"></script>
        <script>
            Promise.all([callSculptureMedia(5), callTokenUri(5)])
                .then(function (r) {
                    var html = r[0],
                        tokenUri = r[1];
                    var escaped = tokenUri
                        .replace(/\\/g, "\\\\")
                        .replace(/'/g, "\\'")
                        .replace(/\n/g, "\\n")
                        .replace(/\r/g, "\\r");
                    html = html.replace(
                        /fetch\(tokenUriUrl\)\.then\(r=>r\.text\(\)\)\.then\(render\)\.catch\(\(\)=>render\(''\)\)/,
                        "render('" + escaped + "')",
                    );
                    var l = document.getElementById('loading');
                    if (l) l.remove();
                    document.open();
                    document.write(html);
                    document.close();
                })
                .catch(function (err) {
                    document.body.innerHTML = '<div class="error">' + err.message + "</div>";
                });
        </script>
    </body>
</html>
