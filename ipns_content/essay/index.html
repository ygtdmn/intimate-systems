        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                min-height: 100vh;
            }
            body {
                margin: 0;
                padding: 0;
                background: #fff;
            }
            #loading {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                font-family: monospace;
                color: #999;
                font-size: 0.9rem;
            }
            .error {
                color: #c33;
                text-align: center;
                padding: 2em;
            }
        </style>
    </head>
    <body>
        <div id="loading">gathering intimate systems…</div>
        <script src="/rpc.js"></script>
        <script>
            callEssay()
                .then(function (html) {
                    var l = document.getElementById('loading');
                    if (l) l.remove();
                    document.open();
                    document.write(html);
                    document.close();
                })
                .catch(function (err) {
                    document.body.innerHTML =
                        '<div class="error">' +
                        err.message +
                        '<br><br><small style="opacity:0.6">Try refreshing or check your network connection.</small></div>';
                });
        </script>
    </body>
